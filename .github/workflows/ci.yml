name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Verify CLI entry point
        run: cirnosay --help

      - name: Smoke test — blocks mode
        run: cirnosay -i fgm.png "CI test" | cat

      - name: Smoke test — ascii mode
        run: cirnosay -i fgm.png -m ascii "CI test" | cat
